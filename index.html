<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#f3f1ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1d20" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="コマ帖">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>コマ帖</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">

  <!-- ===== 一覧 ===== -->
  <section id="home" class="view">
    <header class="homebar">
      <h1 class="logo"><span class="logo-mark" aria-hidden="true"></span>コマ帖</h1>
      <div class="homebar-actions">
        <button class="chip" id="syncChip" type="button"><span class="dot"></span><span class="label">同期</span></button>
        <button class="iconbtn" id="openSettings" type="button" aria-label="設定">
          <svg viewBox="0 0 24 24"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
        </button>
      </div>
    </header>
    <main class="home-main">
      <div id="docList" class="doclist"></div>
      <div id="emptyHome" class="empty" hidden>
        <p class="empty-title">まだネームがありません</p>
        <p class="empty-sub">右下の「＋」から、最初のネームを作りましょう。</p>
      </div>
    </main>
    <button class="fab" id="newDoc" type="button" aria-label="新しいネーム">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </section>

  <!-- ===== 編集 ===== -->
  <section id="editor" class="view" hidden>
    <header class="topbar">
      <button class="iconbtn" id="backHome" type="button" aria-label="一覧へ">
        <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <button class="doc-title" id="docTitle" type="button"></button>
      <div class="topbar-right">
        <button class="pagebtn" id="pageLabel" type="button" aria-label="ページ一覧"></button>
        <button class="iconbtn ovbtn" id="toggleOverview" type="button" aria-label="8ページ表示" title="8ページ表示">
          <svg viewBox="0 0 24 24"><rect x="2.5" y="5" width="4.2" height="6" rx=".4"/><rect x="6.7" y="5" width="4.2" height="6" rx=".4"/><rect x="13.1" y="5" width="4.2" height="6" rx=".4"/><rect x="17.3" y="5" width="4.2" height="6" rx=".4"/><rect x="2.5" y="13" width="4.2" height="6" rx=".4"/><rect x="6.7" y="13" width="4.2" height="6" rx=".4"/><rect x="13.1" y="13" width="4.2" height="6" rx=".4"/><rect x="17.3" y="13" width="4.2" height="6" rx=".4"/></svg>
        </button>
        <button class="iconbtn" id="openScript" type="button" aria-label="セリフ一覧">
          <svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4V5Z"/><path d="M8 9h8M8 12h5"/></svg>
        </button>
        <button class="iconbtn" id="openExport" type="button" aria-label="書き出し">
          <svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 17v3h16v-3"/></svg>
        </button>
        <button class="iconbtn" id="openDocMenu" type="button" aria-label="ネームの設定">
          <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg>
        </button>
      </div>
    </header>

    <div id="stageWrap" class="stagewrap">
      <div id="stage" class="stage"></div>
    </div>

    <div id="toolOpts" class="toolopts"></div>

    <nav class="toolbar" aria-label="道具">
      <div class="tools" role="radiogroup">
        <button class="tool" data-tool="hand" type="button" aria-label="移動">
          <svg viewBox="0 0 24 24"><path d="M8 11V5.5a1.5 1.5 0 0 1 3 0V10m0-5.5a1.5 1.5 0 0 1 3 0V10m0-4a1.5 1.5 0 0 1 3 0v4m0-1.5a1.5 1.5 0 0 1 3 0V14a7 7 0 0 1-7 7h-1a6 6 0 0 1-4.8-2.4L3.6 14.3a1.5 1.5 0 0 1 2.3-1.9L8 14.5"/></svg>
          <span>移動</span>
        </button>
        <button class="tool" data-tool="select" type="button" aria-label="選択">
          <svg viewBox="0 0 24 24"><path d="M5 4.5c4.5-1.6 10-1 13 1.5 2.4 2 1.6 5.4-1.6 6.7" stroke-dasharray="2.4 2.2"/><path d="M9.5 9.5 19 13l-4 1.6-1.7 4.1z"/></svg>
          <span>選択</span>
        </button>
        <button class="tool" data-tool="pen" type="button" aria-label="ペン">
          <svg viewBox="0 0 24 24"><path d="M15.2 4.8l4 4L8 20H4v-4L15.2 4.8Z"/><path d="M13 7l4 4"/></svg>
          <span>ペン</span>
        </button>
        <button class="tool" data-tool="eraser" type="button" aria-label="消しゴム">
          <svg viewBox="0 0 24 24"><path d="M8.5 20H20M4.6 15.4l9.2-9.2a2 2 0 0 1 2.8 0l2.2 2.2a2 2 0 0 1 0 2.8l-8.4 8.4a2 2 0 0 1-1.4.6H6.8a2 2 0 0 1-1.4-.6l-.8-.8a2 2 0 0 1 0-2.8Z"/><path d="M9 11l5 5"/></svg>
          <span>消す</span>
        </button>
        <button class="tool" data-tool="panel" type="button" aria-label="コマ">
          <svg viewBox="0 0 24 24"><rect x="4" y="3.5" width="16" height="17" rx=".5"/><path d="M4 10h16M12 10v10.5"/></svg>
          <span>コマ</span>
        </button>
        <button class="tool" data-tool="text" type="button" aria-label="セリフ">
          <svg viewBox="0 0 24 24"><ellipse cx="12" cy="11" rx="8.5" ry="6.5"/><path d="M8.5 16.5 6 21l5-3.6"/><path d="M12 8v6"/></svg>
          <span>セリフ</span>
        </button>
      </div>
      <div class="toolbar-right">
        <button class="iconbtn" id="undo" type="button" aria-label="取り消し">
          <svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
        </button>
        <button class="iconbtn" id="redo" type="button" aria-label="やり直し">
          <svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg>
        </button>
        <span class="sep"></span>
        <button class="iconbtn" id="nextPage" type="button" aria-label="次のページ">
          <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <button class="iconbtn" id="prevPage" type="button" aria-label="前のページ">
          <svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
        </button>
      </div>
    </nav>
  </section>

  <!-- ===== 引き出し・シート ===== -->
  <div id="scrim" class="scrim" hidden></div>

  <aside id="pagesDrawer" class="sheet" hidden aria-label="ページ一覧">
    <div class="sheet-head">
      <h2>ページ</h2>
      <span class="sheet-note" id="pagesNote"></span>
      <button class="iconbtn close" type="button" data-close aria-label="閉じる"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <div class="sheet-body">
      <div id="pageGrid" class="pagegrid"></div>
    </div>
  </aside>

  <aside id="scriptDrawer" class="sheet sheet-tall" hidden aria-label="セリフ一覧">
    <div class="sheet-head">
      <h2>セリフ</h2>
      <button class="btn small" id="copyAll" type="button">全部コピー</button>
      <button class="iconbtn close" type="button" data-close aria-label="閉じる"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <p class="sheet-hint">番号は読む順です。「コピー」したテキストは、クリスタのストーリーエディターのページ欄にそのまま貼れます。</p>
    <div class="sheet-body" id="scriptBody"></div>
  </aside>

  <aside id="exportSheet" class="sheet" hidden aria-label="書き出し">
    <div class="sheet-head">
      <h2>書き出し</h2>
      <button class="iconbtn close" type="button" data-close aria-label="閉じる"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <div class="sheet-body" id="exportBody"></div>
  </aside>

  <aside id="settingsSheet" class="sheet" hidden aria-label="設定">
    <div class="sheet-head">
      <h2>設定</h2>
      <button class="iconbtn close" type="button" data-close aria-label="閉じる"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <div class="sheet-body" id="settingsBody"></div>
  </aside>

  <div id="modal" class="modal" hidden role="dialog" aria-modal="true">
    <div class="modal-card" id="modalCard"></div>
  </div>

  <div id="toast" class="toast" hidden></div>
  <input type="file" id="importFile" accept=".json,.komacho,application/json" hidden>
</div>

<script src="config.js"></script>
<script src="js/model.js"></script>
<script src="js/store.js"></script>
<script src="js/exporter.js"></script>
<script src="js/drive.js"></script>
<script src="js/app.js"></script>
</body>
</html>
